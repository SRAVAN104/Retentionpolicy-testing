trigger:
- main
- feature

variables: 
- group: Retention

stages:
- stage: BuildAndArchive
  displayName: Archive Build Artifacts
  jobs:
    - job: Archive
      pool:
        vmImage: windows-latest
      steps:
        - task: ArchiveFiles@2
          inputs:
            rootFolderOrFile: '$(build.sourcesDirectory)'
            includeRootFolder: false
        - task: PublishBuildArtifacts@1

- stage: RetainBuild
  displayName: Retain Latest 10 Builds on Success for feature
  condition: and(succeeded(), not(canceled()), startsWith(variables['Build.SourceBranch'], 'refs/heads/feature'))
  jobs:
    - job: RetainBuildJob
      displayName: Retain & Cleanup Builds
      pool:
        vmImage: 'windows-latest'
      steps:
        - task: PowerShell@2
          name: RetainLatestBuilds
          displayName: Retain Latest 10 Builds and Delete Old
          inputs:
            failOnStderr: true
            targetType: 'inline'
            script: |
              $ErrorActionPreference = "Stop"

              # Auth setup using PAT
              $pat = "$(PAT)"
              $base64AuthInfo = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes(":$pat"))
              $headers = @{ Authorization = "Basic $base64AuthInfo" }

              $project = "$(System.TeamProject)"
              $orgUri = "$(System.CollectionUri)"
              $uriBase = "$orgUri$project/_apis"

              # Get all builds from last 30 days for 'feature/*' branch
              $cutoffDate = (Get-Date).AddDays(-30).ToString("o")
              $allBuildsUri = "$uriBase/build/builds?branchName=refs/heads/feature&minFinishTime=$cutoffDate&queryOrder=finishTimeDescending&`$top=1000&api-version=6.0-preview.1"
              $allBuilds = Invoke-RestMethod -Uri $allBuildsUri -Headers $headers -Method Get

              # Get the latest 10 successful builds
              $latestSuccessfulBuilds = $allBuilds.value | Where-Object { $_.result -eq "succeeded" } | Select-Object -First 10
              $retainedBuildIds = $latestSuccessfulBuilds | ForEach-Object { $_.id }

              # Apply retention lease to those 10
              foreach ($build in $latestSuccessfulBuilds) {
                $leaseBody = @{
                  definitionId            = $build.definition.id
                  runId                   = $build.id
                  daysValid               = 30
                  protectPipeline         = $true
                  protectPipelineMetadata = $true
                  ownerId                 = "User:$($build.requestedFor.id)"
                } | ConvertTo-Json -Depth 10

                $leaseUri = "$uriBase/build/retention/leases?api-version=6.0-preview.1"
                Write-Host "Applying lease to build ID: $($build.id)"
                Invoke-RestMethod -Uri $leaseUri -Method Post -Headers $headers -ContentType "application/json" -Body $leaseBody
              }

              # Delete builds older than these 10 (both success and failed)
              $buildsToDelete = $allBuilds.value | Where-Object { $_.id -notin $retainedBuildIds }

              foreach ($build in $buildsToDelete) {
                $deleteUri = "$uriBase/build/builds/$($build.id)?api-version=6.0-preview.1"
                Write-Host "Deleting old build ID: $($build.id), result: $($build.result)"
                Invoke-RestMethod -Uri $deleteUri -Method Delete -Headers $headers
              }

              Write-Host "Retained 10 latest successful builds from the last 30 days. Deleted older builds (success and failed) from 'feature/*'."
