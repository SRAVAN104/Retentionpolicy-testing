trigger:
- main
- feature

variables: 
- group: Retention

stages:
- stage: BuildAndArchive
  displayName: Archive Build Artifacts
  jobs:
    - job: Archive
      pool:
        vmImage: windows-latest
      steps:
        - task: ArchiveFiles@2
          inputs:
            rootFolderOrFile: '$(build.sourcesDirectory)'
            includeRootFolder: false
        - task: PublishBuildArtifacts@1

  # Retention policy at stage level
  retention:
    days: 30
    minimumToKeep: 10
    keepForever: false
